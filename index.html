<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ましろの星占い</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Maru+Gothic:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--night:#0e0c1a;--star-gold:#f0d070;--text:#e8e0f0;--text-mid:#a898c0;--border:rgba(200,180,255,0.12)}
html,body{min-height:100%;background:var(--night);color:var(--text);font-family:'Zen Maru Gothic',sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px;position:relative;overflow-x:hidden}
.starfield{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star-dot{position:absolute;border-radius:50%;background:white;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:0.2}50%{opacity:1}}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(100,60,180,0.18) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(60,100,180,0.12) 0%,transparent 50%);pointer-events:none}
.wrapper{width:100%;max-width:560px;position:relative;z-index:1}
.header{text-align:center;margin-bottom:40px}
.date-label{font-family:'Noto Serif JP',serif;font-size:12px;letter-spacing:0.25em;color:var(--text-mid);margin-bottom:24px}
.avatar-container{position:relative;display:inline-block;margin-bottom:20px}
.moon{position:absolute;top:-8px;right:-14px;font-size:22px;animation:moon-glow 4s ease-in-out infinite}
@keyframes moon-glow{0%,100%{transform:rotate(-10deg);opacity:0.7}50%{transform:rotate(10deg);opacity:1}}
.avatar-glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(160,120,255,0.25) 0%,transparent 70%)}
.avatar-ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(200,160,255,0.3);animation:spin-slow 20s linear infinite}
@keyframes spin-slow{to{transform:rotate(360deg)}}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;position:relative;z-index:1;border:2px solid rgba(200,160,255,0.3);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.name{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:600;letter-spacing:0.15em;background:linear-gradient(135deg,#f0d070,#e8c0f8,#a0c8f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.tagline{font-size:12px;letter-spacing:0.2em;color:var(--text-mid)}
.seiza-section{margin-bottom:32px}
.section-title{text-align:center;font-size:11px;letter-spacing:0.25em;color:var(--text-mid);margin-bottom:16px}
.seiza-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seiza-btn{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:10px 6px 8px;cursor:pointer;transition:all 0.25s;display:flex;flex-direction:column;align-items:center;gap:3px}
.seiza-btn:hover{background:rgba(160,120,255,0.1);border-color:rgba(200,160,255,0.35);transform:translateY(-2px)}
.seiza-btn.active{background:rgba(160,120,255,0.2);border-color:rgba(200,160,255,0.6);box-shadow:0 0 12px rgba(160,120,255,0.2)}
.seiza-sym{font-size:20px;line-height:1}
.seiza-name{font-size:11px;color:var(--text-mid);letter-spacing:0.04em}
.seiza-btn.active .seiza-name{color:rgba(220,200,255,0.9)}
.seiza-date{font-size:9px;color:rgba(150,140,180,0.7)}
.card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:36px 32px;min-height:200px;position:relative;backdrop-filter:blur(4px)}
.card::before{content:'✦';position:absolute;top:12px;left:16px;font-size:10px;color:rgba(240,208,112,0.3)}
.card::after{content:'✦';position:absolute;bottom:12px;right:16px;font-size:10px;color:rgba(240,208,112,0.3)}
.initial-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;gap:20px}
.hint-text{font-size:13px;color:var(--text-mid);letter-spacing:0.1em}
.start-btn{background:linear-gradient(135deg,rgba(140,100,240,0.3),rgba(100,140,240,0.3));border:1px solid rgba(200,160,255,0.4);border-radius:100px;padding:13px 40px;font-family:'Noto Serif JP',serif;font-size:15px;font-weight:300;letter-spacing:0.2em;color:var(--text);cursor:pointer;transition:all 0.3s}
.start-btn:hover{background:linear-gradient(135deg,rgba(140,100,240,0.5),rgba(100,140,240,0.5));transform:translateY(-2px)}
.start-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.result-state{display:none;flex-direction:column;gap:20px}
.result-header{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}
.result-seiza-info{display:flex;align-items:center;gap:10px}
.result-sym{font-size:28px}
.result-name{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:600;letter-spacing:0.1em;background:linear-gradient(135deg,#f0d070,#c8b0f8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-rank{font-size:11px;letter-spacing:0.12em;color:var(--text-mid);margin-top:2px}
.stars-row{display:flex;gap:3px}
.star{font-size:13px;color:var(--star-gold)}
.star.empty{color:rgba(200,200,255,0.15)}
.fortune-body{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:300;line-height:2.2;color:rgba(232,224,248,0.9);letter-spacing:0.04em;white-space:pre-line}
.lucky-box{background:rgba(240,208,112,0.06);border:1px solid rgba(240,208,112,0.2);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.lucky-label{font-size:10px;letter-spacing:0.2em;color:var(--star-gold);white-space:nowrap}
.lucky-value{font-size:14px;color:rgba(240,208,112,0.9)}
.result-footer{display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--border)}
.sig{font-size:12px;color:var(--text-mid);letter-spacing:0.1em}
.retry-btn{background:none;border:1px solid var(--border);border-radius:100px;padding:6px 18px;font-family:'Zen Maru Gothic',sans-serif;font-size:12px;color:var(--text-mid);cursor:pointer;transition:all 0.2s}
.retry-btn:hover{border-color:rgba(200,160,255,0.4);color:var(--text)}
.footer{margin-top:28px;text-align:center;font-size:11px;letter-spacing:0.2em;color:rgba(168,152,192,0.5)}
.shooting-star{position:fixed;width:2px;height:2px;background:white;border-radius:50%;pointer-events:none;animation:shoot linear forwards}
@keyframes shoot{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(200px,200px)}}
</style>
</head>

var RANKS=["第1位✨","第2位","第3位","第4位","第5位","第6位","第7位","第8位","第9位","第10位","第11位","第12位"];
var NAMES=["牡羊座","牡牛座","双子座","蟹座","獅子座","乙女座","天秤座","蠍座","射手座","山羊座","水瓶座","魚座"];
var SYMS=["🐏","🐂","👫","🦀","🦁","🌾","⚖","🦂","🏹","🐐","🏺","🐟"];

function seededRandom(seed){var x=Math.sin(seed)*10000;return x-Math.floor(x)}
function dateSeed(extra){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+extra}

function selectSeiza(idx,sym,name,fortuneIdx){
  document.querySelectorAll(".seiza-btn").forEach(function(b){b.classList.remove("active")});
  document.querySelectorAll(".seiza-btn")[idx].classList.add("active");
  selectedSeiza={idx:idx,sym:sym,name:name};
  document.getElementById("startBtn").disabled=false;
  document.getElementById("hintText").textContent=sym+" "+name+"の運勢を占います";
  document.getElementById("resultState").style.display="none";
  document.getElementById("initialState").style.display="flex";
}

function renderStars(n){
  var s="";
  for(var i=0;i<5;i++)s+='<span class="star'+(i<n?"":" empty")+'">★</span>';
  return s;
}

function showFortune(){
  if(!selectedSeiza)return;
  var list=FORTUNES[selectedSeiza.name];
  var seed=dateSeed(selectedSeiza.idx*77);
  var fi=Math.floor(seededRandom(seed)*list.length);
  var ri=Math.floor(seededRandom(seed+1)*12);
  var stars=Math.floor(seededRandom(seed+2)*3)+3;
  var f=list[fi];
  document.getElementById("resultSym").textContent=selectedSeiza.sym;
  document.getElementById("resultName").textContent=selectedSeiza.name;
  document.getElementById("resultRank").textContent="今日のランキング "+RANKS[ri];
  document.getElementById("resultStars").innerHTML=renderStars(stars);
  document.getElementById("fortuneBody").textContent=f.text;
  document.getElementById("luckyValue").textContent=f.lucky;
  document.getElementById("initialState").style.display="none";
  document.getElementById("resultState").style.display="flex";
  for(var i=0;i<5;i++)(function(i){setTimeout(function(){
    var s=document.createElement("div");
    s.className="shooting-star";
    s.style.top=Math.random()*50+"%";
    s.style.left=Math.random()*80+"%";
    s.style.animationDuration=(0.6+Math.random()*0.4)+"s";
    document.body.appendChild(s);
    setTimeout(function(){s.remove()},1200);
  },i*200)})(i);
}

(function(){
  var sf=document.getElementById("starfield");
  for(var i=0;i<80;i++){
    var dot=document.createElement("div");
    dot.className="star-dot";
    var size=Math.random()*2+0.5;
    dot.style.cssText="width:"+size+"px;height:"+size+"px;top:"+Math.random()*100+"%;left:"+Math.random()*100+"%;animation-duration:"+(2+Math.random()*4)+"s;animation-delay:"+Math.random()*4+"s;";
    sf.appendChild(dot);
  }
})();
</script>
